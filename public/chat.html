<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickChat - Instant Room Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0d14;
      --card: #111827;
      --border: #1f2937;
      --primary: #22d3ee;
      --accent: #a855f7;
      --text: #f3f4f6;
      --muted: #6b7280;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
    }

    .hidden { display: none !important; }

    /* Entry Screen */
    .entry-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }

    .bg-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      animation: pulse 4s ease-in-out infinite;
    }

    .bg-glow-1 {
      top: 20%;
      left: 20%;
      background: var(--primary);
    }

    .bg-glow-2 {
      bottom: 20%;
      right: 20%;
      background: var(--accent);
      animation-delay: 2s;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .entry-content {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 10;
      animation: slideUp 0.5s ease-out;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 80px;
      height: 80px;
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid var(--border);
      border-radius: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      backdrop-filter: blur(20px);
      position: relative;
    }

    .logo-icon::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 1rem;
      padding: 1px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }

    .logo-icon svg {
      width: 40px;
      height: 40px;
      color: var(--primary);
    }

    .logo-title {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .logo-subtitle {
      color: var(--muted);
      font-size: 1rem;
    }

    .glass-card {
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2rem;
    }

    .btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 0.75rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: var(--bg);
    }

    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-secondary {
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover { background: rgba(31, 41, 55, 0.9); }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      transition: color 0.2s;
    }

    .back-btn:hover { color: var(--text); }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      height: 48px;
      background: rgba(31, 41, 55, 0.5);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0 1rem;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-input::placeholder {
      color: var(--muted);
    }

    .form-input.code-input {
      font-family: monospace;
      text-align: center;
      font-size: 1.5rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .footer-text {
      text-align: center;
      color: rgba(107, 114, 128, 0.6);
      font-size: 0.875rem;
      margin-top: 1.5rem;
    }

    /* Chat Screen */
    .chat-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .leave-btn {
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      border-radius: 0.5rem;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .leave-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .header-info h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .header-info p {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .room-code-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .room-code-btn:hover { background: rgba(31, 41, 55, 0.9); }

    .room-code-btn span {
      font-family: monospace;
      color: var(--primary);
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }

    .room-code-btn svg {
      width: 16px;
      height: 16px;
      color: var(--muted);
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid var(--border);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .empty-icon svg {
      width: 32px;
      height: 32px;
      color: var(--primary);
    }

    .empty-state p {
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .empty-state .code-highlight {
      color: var(--primary);
      font-family: monospace;
    }

    .message {
      margin-bottom: 1rem;
      animation: slideUp 0.3s ease-out;
    }

    .message.sent { display: flex; justify-content: flex-end; }
    .message.received { display: flex; justify-content: flex-start; }

    .message-bubble {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      word-wrap: break-word;
    }

    .message.sent .message-bubble {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: var(--bg);
      border-bottom-right-radius: 0.25rem;
    }

    .message.received .message-bubble {
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid var(--border);
      border-bottom-left-radius: 0.25rem;
    }

    .message-sender {
      font-size: 0.75rem;
      color: var(--primary);
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .message-text {
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .message-time {
      font-size: 0.7rem;
      margin-top: 0.25rem;
      opacity: 0.7;
    }

    .message.received .message-time { color: var(--muted); }

    .chat-input-container {
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 1rem;
      position: sticky;
      bottom: 0;
    }

    .chat-input-wrapper {
      display: flex;
      gap: 0.75rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .chat-input {
      flex: 1;
      height: 48px;
      background: rgba(31, 41, 55, 0.5);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0 1rem;
      color: var(--text);
      font-size: 1rem;
    }

    .chat-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .send-btn {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      border-radius: 0.75rem;
      color: var(--bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    .send-btn:hover { opacity: 0.9; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      color: var(--text);
      z-index: 1000;
      animation: slideUp 0.3s ease-out;
    }

    .toast.error { border-color: #ef4444; }
    .toast.success { border-color: #22c55e; }
  </style>
</head>
<body>
  <!-- Entry Screen -->
  <div id="entryScreen" class="entry-screen">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    
    <div class="entry-content">
      <div class="logo-section">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <h1 class="logo-title">QuickChat</h1>
        <p class="logo-subtitle">Connect instantly with a room code</p>
      </div>

      <div class="glass-card">
        <!-- Choice View -->
        <div id="choiceView" class="btn-group">
          <button class="btn btn-primary" onclick="showView('createView')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v18M5 10l7-7 7 7"/>
            </svg>
            Create Room
          </button>
          <button class="btn btn-secondary" onclick="showView('joinView')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Join Room
          </button>
        </div>

        <!-- Create View -->
        <div id="createView" class="hidden">
          <button class="back-btn" onclick="showView('choiceView')">← Back</button>
          <div class="form-group">
            <label class="form-label">Your Name</label>
            <input type="text" id="createName" class="form-input" placeholder="Enter your name" maxlength="20">
          </div>
          <button class="btn btn-primary" onclick="createRoom()">
            Create & Get Code
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>

        <!-- Join View -->
        <div id="joinView" class="hidden">
          <button class="back-btn" onclick="showView('choiceView')">← Back</button>
          <div class="form-group">
            <label class="form-label">Your Name</label>
            <input type="text" id="joinName" class="form-input" placeholder="Enter your name" maxlength="20">
          </div>
          <div class="form-group">
            <label class="form-label">Room Code</label>
            <input type="text" id="joinCode" class="form-input code-input" placeholder="XXXXXX" maxlength="6">
          </div>
          <button class="btn btn-primary" onclick="joinRoom()">
            Join Room
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </div>

      <p class="footer-text">No account needed • End-to-end simple</p>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chatScreen" class="chat-screen hidden">
    <header class="chat-header">
      <div class="header-left">
        <button class="leave-btn" onclick="leaveRoom()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
        <div class="header-info">
          <h1>QuickChat</h1>
          <p>Welcome, <span id="displayName"></span></p>
        </div>
      </div>
      <button class="room-code-btn" onclick="copyCode()">
        <span id="displayCode"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>
    </header>

    <div id="messagesContainer" class="messages-container">
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </div>
        <p>No messages yet</p>
        <p style="font-size: 0.875rem;">Share the code <span class="code-highlight" id="emptyCode"></span> to start chatting</p>
      </div>
      <div id="messagesList"></div>
    </div>

    <div class="chat-input-container">
      <div class="chat-input-wrapper">
        <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." maxlength="500">
        <button class="send-btn" onclick="sendMessage()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAooasycmB64_D_UwaXa3QyGtT510ZRle8",
      authDomain: "chatapp-d19d0.firebaseapp.com",
      databaseURL: "https://chatapp-d19d0-default-rtdb.firebaseio.com",
      projectId: "chatapp-d19d0",
      storageBucket: "chatapp-d19d0.firebasestorage.app",
      messagingSenderId: "62482689774",
      appId: "1:62482689774:web:2edcb2c882d934e9c38dff"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let currentRoom = null;
    let currentUser = null;
    let unsubscribe = null;

    // Utility functions
    window.showView = function(viewId) {
      document.getElementById('choiceView').classList.add('hidden');
      document.getElementById('createView').classList.add('hidden');
      document.getElementById('joinView').classList.add('hidden');
      document.getElementById(viewId).classList.remove('hidden');
    };

    function showToast(message, type = 'success') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function generateCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    function formatTime(timestamp) {
      return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Room functions
    window.createRoom = async function() {
      const name = document.getElementById('createName').value.trim();
      if (!name) {
        showToast('Please enter your name', 'error');
        return;
      }

      const code = generateCode();
      try {
        await set(ref(database, `rooms/${code}`), {
          createdAt: Date.now(),
          users: { [name]: true }
        });
        currentRoom = code;
        currentUser = name;
        showToast(`Room ${code} created!`);
        enterChat();
      } catch (error) {
        showToast('Failed to create room', 'error');
      }
    };

    window.joinRoom = async function() {
      const name = document.getElementById('joinName').value.trim();
      const code = document.getElementById('joinCode').value.trim().toUpperCase();
      
      if (!name) {
        showToast('Please enter your name', 'error');
        return;
      }
      if (!code || code.length !== 6) {
        showToast('Please enter a valid 6-character code', 'error');
        return;
      }

      try {
        const snapshot = await get(ref(database, `rooms/${code}`));
        if (!snapshot.exists()) {
          showToast('Room not found', 'error');
          return;
        }
        await set(ref(database, `rooms/${code}/users/${name}`), true);
        currentRoom = code;
        currentUser = name;
        showToast('Joined room!');
        enterChat();
      } catch (error) {
        showToast('Failed to join room', 'error');
      }
    };

    function enterChat() {
      document.getElementById('entryScreen').classList.add('hidden');
      document.getElementById('chatScreen').classList.remove('hidden');
      document.getElementById('displayName').textContent = currentUser;
      document.getElementById('displayCode').textContent = currentRoom;
      document.getElementById('emptyCode').textContent = currentRoom;

      // Subscribe to messages
      const messagesRef = ref(database, `rooms/${currentRoom}/messages`);
      unsubscribe = onValue(messagesRef, (snapshot) => {
        const data = snapshot.val();
        const messagesList = document.getElementById('messagesList');
        const emptyState = document.getElementById('emptyState');
        
        if (data) {
          emptyState.classList.add('hidden');
          const messages = Object.entries(data)
            .map(([id, msg]) => ({ id, ...msg }))
            .sort((a, b) => a.timestamp - b.timestamp);
          
          messagesList.innerHTML = messages.map(msg => `
            <div class="message ${msg.sender === currentUser ? 'sent' : 'received'}">
              <div class="message-bubble">
                ${msg.sender !== currentUser ? `<div class="message-sender">${msg.sender}</div>` : ''}
                <div class="message-text">${escapeHtml(msg.text)}</div>
                <div class="message-time">${formatTime(msg.timestamp)}</div>
              </div>
            </div>
          `).join('');
          
          messagesList.scrollTop = messagesList.scrollHeight;
        } else {
          emptyState.classList.remove('hidden');
          messagesList.innerHTML = '';
        }
      });

      // Focus input
      document.getElementById('messageInput').focus();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.leaveRoom = function() {
      if (unsubscribe) unsubscribe();
      currentRoom = null;
      currentUser = null;
      document.getElementById('chatScreen').classList.add('hidden');
      document.getElementById('entryScreen').classList.remove('hidden');
      document.getElementById('createName').value = '';
      document.getElementById('joinName').value = '';
      document.getElementById('joinCode').value = '';
      showView('choiceView');
    };

    window.sendMessage = async function() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      try {
        await push(ref(database, `rooms/${currentRoom}/messages`), {
          text,
          sender: currentUser,
          timestamp: Date.now()
        });
        input.value = '';
      } catch (error) {
        showToast('Failed to send message', 'error');
      }
    };

    window.copyCode = function() {
      navigator.clipboard.writeText(currentRoom);
      showToast('Room code copied!');
    };

    // Enter key to send
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Auto-uppercase room code
    document.getElementById('joinCode').addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase();
    });
  </script>
</body>
</html>
